[project]
name = "请假管理"
description = "企业请假管理数字化平台"
locale = "zh"

[server]
port = 5173

[database]
url = "postgres://kenvoy:kenvoy@127.0.0.1:5433/kenvoy"

[storage]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
bucket = "kenvoy-dev"
access_key = "minioadmin"
secret_key = "minioadmin"
# 上传限制（缺省不限）：
# max_size_mb = 10
# allowed_types = ["image/*", "application/pdf"]

[auth]
# 注册模式：open（公开注册）| review（审核注册）| hr（人事绑定式，关闭公开注册）
mode = "open"
# 管理端点（用户/角色/部门/通讯录、审核）所需最低账号等级
admin_level = 90
# 密码强度：none | weak | medium | strong | custom
[auth.password]
strength = "none"

# SMTP 邮件发送（用于密码重置等场景；不配置则跳过邮件，token 仅 eprintln/响应体输出）
# [mail]
# smtp_host = "smtp.example.com"
# smtp_port = 587                # 465=SSL/TLS  587=STARTTLS  25=明文
# smtp_user = "no-reply@example.com"
# smtp_pass = "app-password"
# from = "no-reply@example.com"
# reset_url_base = "https://your-app.example.com"  # 拼成重置链接
