[project]
name = "customer-app"
version = "0.1.0"
min_cli_version = "0.4.0"
format_version = "0.4.0"

[application]
entry = "src/app.tsx"

[server]
host = "127.0.0.1"
port = 3000

[database]
provider = "sqlite"
path = "data/app.sqlite"

[frontend]
framework = "react"
render = "csr"

[runtime]
javascript = "quickjs"

[build]
out_dir = "dist"

[languages]
fallback = "zh-CN"

[languages.zh-CN]
display = "简体中文"
