[project]
name = "i18n-app"
version = "0.1.0"
min_cli_version = "0.3.0"
format_version = "0.3.0"

[application]
entry = "src/app.tsx"

[server]
host = "127.0.0.1"
port = 3000

[database]
provider = "sqlite"
path = "data/app.sqlite"

[build]
out_dir = "dist"

[i18n]
default_locale = "zh-CN"
locales = ["zh-CN", "en-US"]
messages_dir = "locales"
