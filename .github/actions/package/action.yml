name: 原生系统单目标打包
description: 从 checkout 或官方 registry 源码构建一个目标，只上传 ZIP 与 SHA256 artifact
inputs:
  target:
    description: 六目标清单中的 Rust triple
    required: true
  version:
    description: 精确正式版本 major.minor.patch
    required: true
  source-mode:
    description: checkout 准备前端；registry 使用已发布且 checksum 校验通过的源码与资产
    default: checkout
  archive-name:
    description: 可选普通 ZIP basename，默认使用 platform-arch 命名
    default: ''
outputs:
  artifact-name:
    description: kenvoy-VERSION-TARGET
    value: ${{ steps.prepare.outputs.artifact-name }}
  archive-name:
    description: 实际 ZIP basename，侧车文件在其后追加 .sha256
    value: ${{ steps.prepare.outputs.archive-name }}
runs:
  using: composite
  steps:
    - name: 准备固定 Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.12.10'

    - name: 核对原生 runner 并准备精确源码
      id: prepare
      shell: bash
      env:
        PYTHONUTF8: '1'
        DIST_INPUT_TARGET: ${{ inputs.target }}
        DIST_INPUT_VERSION: ${{ inputs.version }}
        DIST_INPUT_SOURCE_MODE: ${{ inputs.source-mode }}
        DIST_INPUT_ARCHIVE_NAME: ${{ inputs.archive-name }}
      run: python "${{ github.action_path }}/../../scripts/package_source.py" prepare

    - name: 安装固定 Rust 并核对 host 与目标
      shell: bash
      run: |
        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
        rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$DIST_HOST" "$DIST_TARGET"
        python "${{ github.action_path }}/../../scripts/package_source.py" verify-host

    - name: 选择固定 Apple SDK
      if: runner.os == 'macOS'
      shell: bash
      env:
        DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      run: |
        set -euo pipefail
        sdk="$(xcrun --sdk macosx15.5 --show-sdk-path)"
        test -d "$sdk"
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
        echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
        xcodebuild -version

    # cargo-zigbuild v0.24.0 的官方 CI 使用 Zig 0.17.0；Zig 不替代 Apple SDK。
    - name: 准备固定 Zig
      if: runner.os != 'Windows'
      uses: mlugg/setup-zig@v2.0.5
      with:
        version: '0.17.0'
        use-cache: false

    - name: 准备固定 cargo-zigbuild 与 Zig host 编译入口
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
          --ignore-installed --prefix "$DIST_ZIGBUILD_ROOT" 'cargo-zigbuild==0.24.0'
        tools="$DIST_ZIG_TOOLS"
        printf '#!/bin/sh\nexec "$DIST_ZIGBUILD_ROOT/bin/cargo-zigbuild" zig cc -- -target "$DIST_ZIG_HOST" "$@"\n' > "$tools/cc"
        printf '#!/bin/sh\nexec "$DIST_ZIGBUILD_ROOT/bin/cargo-zigbuild" zig c++ -- -target "$DIST_ZIG_HOST" "$@"\n' > "$tools/c++"
        printf '#!/bin/sh\nexec "$DIST_ZIGBUILD_ROOT/bin/cargo-zigbuild" zig ar -- "$@"\n' > "$tools/ar"
        chmod +x "$tools/cc" "$tools/c++" "$tools/ar"
        export PATH="$tools:$PATH" CC="$tools/cc" CXX="$tools/c++" AR="$tools/ar"
        export CARGO_ZIGBUILD_ZIG_PATH="$(command -v zig)"
        echo "$DIST_ZIGBUILD_ROOT/bin" >> "$GITHUB_PATH"
        echo "$tools" >> "$GITHUB_PATH"
        echo "CC=$CC" >> "$GITHUB_ENV"
        echo "CXX=$CXX" >> "$GITHUB_ENV"
        echo "AR=$AR" >> "$GITHUB_ENV"
        echo "HOST_CC=$CC" >> "$GITHUB_ENV"
        echo "HOST_CXX=$CXX" >> "$GITHUB_ENV"
        echo "HOST_AR=$AR" >> "$GITHUB_ENV"
        echo "CARGO_ZIGBUILD_CACHE_DIR=$tools/cache" >> "$GITHUB_ENV"
        echo "CARGO_ZIGBUILD_ZIG_PATH=$CARGO_ZIGBUILD_ZIG_PATH" >> "$GITHUB_ENV"
        zig version
        "$DIST_ZIGBUILD_ROOT/bin/cargo-zigbuild" --version

    - name: 准备 Windows 原生工程编译器
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x64
        sdk: '10.0.26100.0'
        toolset: '14.44'
        vsversion: '2022'

    - name: 构建 Windows host 的 Rust 分发工具
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cargo build --locked --release --package xtask --bin xtask `
          --target $env:DIST_HOST --target-dir $env:DIST_BUILD_DIR

    - name: 构建 Linux/macOS host 的 Rust 分发工具
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cargo zigbuild --locked --release --package xtask --bin xtask \
          --target "$DIST_HOST" --target-dir "$DIST_BUILD_DIR"

    - name: 准备固定 Node（仅 checkout）
      if: inputs.source-mode == 'checkout'
      uses: actions/setup-node@v4.4.0
      with:
        node-version: '24.22.0'
        cache: npm
        cache-dependency-path: crates/kenvoy/frontend/package-lock.json

    - name: 准备 checkout 的内置前端
      if: inputs.source-mode == 'checkout'
      shell: bash
      working-directory: ${{ env.DIST_PACKAGE_DIR }}/frontend
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build

    - name: 准备 Windows 目标交叉编译器（MSVC，不是 GCC）
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: ${{ env.DIST_MSVC_ARCH }}
        sdk: '10.0.26100.0'
        toolset: '14.44'
        vsversion: '2022'

    - name: 从精确源码构建 Windows release CLI
      # PowerShell 保留开发者环境 PATH，避免 Git Bash 的 link.exe 抢占 MSVC。
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ env.DIST_PACKAGE_DIR }}
      run: |
        cargo build --locked --release --bin kenvoy --manifest-path $env:DIST_MANIFEST `
          --target $env:DIST_TARGET --target-dir $env:DIST_BUILD_DIR

    - name: 从精确源码构建 Linux/macOS release CLI
      if: runner.os != 'Windows'
      shell: bash
      working-directory: ${{ env.DIST_PACKAGE_DIR }}
      run: |
        cargo zigbuild --locked --release --bin kenvoy --manifest-path "$DIST_MANIFEST" \
          --target "$DIST_TARGET" --target-dir "$DIST_BUILD_DIR"

    - name: 校验格式、架构与版本并归档
      shell: bash
      run: python "${{ github.action_path }}/../../scripts/package_source.py" archive

    - name: 上传本目标 ZIP 与 SHA256（仅 artifact）
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ steps.prepare.outputs.artifact-name }}
        path: |
          ${{ env.DIST_ARTIFACT_DIR }}/${{ steps.prepare.outputs.archive-name }}
          ${{ env.DIST_ARTIFACT_DIR }}/${{ steps.prepare.outputs.archive-name }}.sha256
        if-no-files-found: error
        compression-level: 0
        retention-days: 14

    - name: 清理本次独占临时目录
      if: always()
      shell: bash
      run: python "${{ github.action_path }}/../../scripts/package_source.py" cleanup
