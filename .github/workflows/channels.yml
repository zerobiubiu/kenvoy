name: 多渠道软件包发布

# 由 main 发布工作流成功结束后触发，或手动指定版本补发；只处理已存在的 GitHub Release。
on:
  workflow_run:
    workflows: ["main 最新版本自动发布"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 已发布版本 X.Y.Z；留空则读取默认分支当前版本
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: kenvoy-channels
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    name: 解析版本与六个发布归档
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
    steps:
      - name: 仅允许本仓库 main 的发布上下文
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$SOURCE_BRANCH" != main ] || [ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo '渠道发布只允许本仓库 main；不会从 dev、tag 或外部仓库发布。' >&2
            exit 1
          fi
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          requested="${INPUT_VERSION:-}"
          if [ -z "$requested" ]; then
            requested=$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('crates/kenvoy/Cargo.toml').read_text(encoding='utf-8'))['package']['version'])
          PY
            )
          fi
          python -c 'import re,sys; v=sys.argv[1]; sys.exit(0 if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", v) else 1)' "$requested" \
            || { echo "版本不是正式 X.Y.Z：$requested" >&2; exit 1; }
          git rev-parse --verify "refs/tags/v${requested}^{commit}" >/dev/null \
            || { echo "缺少版本标签 v${requested}" >&2; exit 1; }
          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "refs/tags/v${requested}^{commit}")" >> "$GITHUB_OUTPUT"
      - name: 生成并下载六个官方 Release 归档
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/scripts/channels/assets.py --version "${{ steps.version.outputs.version }}" \
            --repository "${{ github.repository }}" --output "$RUNNER_TEMP/assets.json" \
            --zips "$RUNNER_TEMP/zips"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: channel-assets
          path: |
            ${{ runner.temp }}/assets.json
            ${{ runner.temp }}/zips/*.zip
          if-no-files-found: error
          retention-days: 14

  npm:
    needs: prepare
    name: npm 主包与六个平台包
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.22.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4.3.0
        with:
          name: channel-assets
          path: ${{ runner.temp }}/channel
      - name: 生成 npm 包
        run: |
          set -euo pipefail
          python .github/scripts/channels/npm_packages.py \
            --assets "$RUNNER_TEMP/channel/assets.json" --zips "$RUNNER_TEMP/channel/zips" \
            --output "$RUNNER_TEMP/npm"
      - name: 只发布缺失版本，平台包先于主包
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo '未配置 NPM_TOKEN：使用 npm Trusted Publishing，七个包必须已绑定 channels.yml。'
          fi
          python .github/scripts/channels/publish_npm.py --packages "$RUNNER_TEMP/npm" --publish

  homebrew:
    needs: prepare
    name: Homebrew tap formula
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: channel-assets
          path: ${{ runner.temp }}/channel
      - name: 渲染并推送 formula
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then echo '缺少仓库 Secret PACKAGES_TOKEN' >&2; exit 1; fi
          python .github/scripts/channels/manifests.py \
            --assets "$RUNNER_TEMP/channel/assets.json" --output "$RUNNER_TEMP/manifests"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp "$RUNNER_TEMP/manifests/brew/Formula/kenvoy.rb" tap/Formula/kenvoy.rb
          cd tap
          git config user.name kenvoy-release
          git config user.email release@users.noreply.github.com
          git add Formula/kenvoy.rb
          if git diff --cached --quiet; then echo 'Homebrew formula 已是最新'; exit 0; fi
          git commit -m "kenvoy ${{ needs.prepare.outputs.version }}"
          git push origin HEAD

  scoop:
    needs: prepare
    name: Scoop bucket manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: channel-assets
          path: ${{ runner.temp }}/channel
      - name: 渲染并推送 bucket
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then echo '缺少仓库 Secret PACKAGES_TOKEN' >&2; exit 1; fi
          python .github/scripts/channels/manifests.py \
            --assets "$RUNNER_TEMP/channel/assets.json" --output "$RUNNER_TEMP/manifests"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp "$RUNNER_TEMP/manifests/scoop/bucket/kenvoy.json" bucket/bucket/kenvoy.json
          cd bucket
          git config user.name kenvoy-release
          git config user.email release@users.noreply.github.com
          git add bucket/kenvoy.json
          if git diff --cached --quiet; then echo 'Scoop manifest 已是最新'; exit 0; fi
          git commit -m "kenvoy ${{ needs.prepare.outputs.version }}"
          git push origin HEAD

  winget:
    needs: prepare
    name: WinGet 清单 PR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: channel-assets
          path: ${{ runner.temp }}/channel
      - name: 渲染清单并提交 PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo '缺少仓库 Secret WINGET_TOKEN（需 public_repo 的 PAT）' >&2; exit 1; fi
          python .github/scripts/channels/manifests.py \
            --assets "$RUNNER_TEMP/channel/assets.json" --output "$RUNNER_TEMP/manifests"
          python .github/scripts/channels/publish_winget.py \
            --manifests "$RUNNER_TEMP/manifests/winget/manifests/k/Kenvoy/Kenvoy/$VERSION" \
            --version "$VERSION" --owner "$OWNER" --publish

  chocolatey:
    needs: prepare
    name: Chocolatey 包
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: channel-assets
          path: ${{ runner.temp }}/channel
      - name: 渲染并推送 nupkg
        shell: pwsh
        env:
          API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:API_KEY)) { throw '缺少仓库 Secret CHOCOLATEY_API_KEY' }
          python .github/scripts/channels/manifests.py --assets "$env:RUNNER_TEMP/channel/assets.json" --output "$env:RUNNER_TEMP/manifests"
          if ($LASTEXITCODE -ne 0) { throw '渠道清单生成失败' }
          Push-Location "$env:RUNNER_TEMP/manifests/chocolatey"
          choco pack
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey 打包失败' }
          $package = Get-ChildItem -Filter '*.nupkg' | Select-Object -First 1
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey 上传失败' }
          Pop-Location

  aur:
    needs: prepare
    name: AUR kenvoy-bin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: channel-assets
          path: ${{ runner.temp }}/channel
      - name: 推送 PKGBUILD
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_KEY:-}" ]; then echo '缺少仓库 Secret AUR_SSH_PRIVATE_KEY' >&2; exit 1; fi
          python .github/scripts/channels/manifests.py \
            --assets "$RUNNER_TEMP/channel/assets.json" --output "$RUNNER_TEMP/manifests"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          if ! git clone "ssh://aur@aur.archlinux.org/kenvoy-bin.git" aur; then
            echo 'AUR 克隆失败：请确认 AUR 账号已在 My Account 登记该 SSH 公钥，且 SSH 可访问 aur.archlinux.org' >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/manifests/aur/PKGBUILD" aur/PKGBUILD
          cp "$RUNNER_TEMP/manifests/aur/.SRCINFO" aur/.SRCINFO
          cd aur
          git config user.name kenvoy-release
          git config user.email release@users.noreply.github.com
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo 'AUR 已是最新'; exit 0; fi
          git commit -m "kenvoy ${{ needs.prepare.outputs.version }}"
          # AUR 只接受 master；空仓库首次推送即创建包。
          git push origin HEAD:master

  linux_repos:
    needs: prepare
    name: APT / RPM / Alpine / Arch 仓库
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: channel-assets
          path: ${{ runner.temp }}/channel
      - name: 读取现有包仓库，失败时停止而不是当作空仓库
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then echo '缺少仓库 Secret PACKAGES_TOKEN' >&2; exit 1; fi
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/kenvoy-packages.git" "$RUNNER_TEMP/old"
      - name: 安装打包、索引与签名工具
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev createrepo-c pacman-package-manager gnupg openssl rpm
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tgz" \
            https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz
          echo 'a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b  nfpm.tgz' |
            (cd "$RUNNER_TEMP" && sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/nfpm.tgz" -C "$RUNNER_TEMP" nfpm
          # Ubuntu 没有 apk-tools：用 alpine 容器包装 apk index，保持索引与 apk-tools 一致。
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/apk" <<'EOF'
          #!/bin/sh
          exec docker run --rm -v "$PWD:/work" -w /work alpine:3.20 apk "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/apk"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: 准备签名密钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${APK_SIGNING_KEY:-}" ]; then
            echo '缺少仓库 Secret GPG_PRIVATE_KEY / APK_SIGNING_KEY' >&2; exit 1
          fi
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -m 700 -d "$GNUPGHOME" "$RUNNER_TEMP/apk"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > "$RUNNER_TEMP/release-signing.asc"
          gpg --batch --import "$RUNNER_TEMP/release-signing.asc"
          printf '%s' "$APK_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/apk/kenvoy.rsa"
          openssl rsa -in "$RUNNER_TEMP/apk/kenvoy.rsa" -pubout -out "$RUNNER_TEMP/apk/kenvoy.rsa.pub"
          mapfile -t signing_keys < <(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5}')
          [ "${#signing_keys[@]}" -eq 1 ] || { echo 'GPG_PRIVATE_KEY 必须只包含一项主密钥' >&2; exit 1; }
          echo "GPG_KEY=${signing_keys[0]}" >> "$GITHUB_ENV"
      - name: 生成八份配置并构建四类安装包
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          python .github/scripts/channels/linux_packages.py \
            --assets "$RUNNER_TEMP/channel/assets.json" --zips "$RUNNER_TEMP/channel/zips" \
            --output "$RUNNER_TEMP/linux" --apk-key "$RUNNER_TEMP/apk/kenvoy.rsa" \
            --rpm-key "$RUNNER_TEMP/release-signing.asc" --rpm-key-id "$GPG_KEY"
          python .github/scripts/channels/build_linux_packages.py \
            --configs "$RUNNER_TEMP/linux" --previous "$RUNNER_TEMP/old" \
            --output "$RUNNER_TEMP/pkgs" --nfpm "$RUNNER_TEMP/nfpm" --version "${{ needs.prepare.outputs.version }}"
      - name: 合并旧版本并生成四类仓库索引
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assemble"
          # 同名历史包只接受相同字节；新构建器会复用已发布版本，不重签 RPM 包。
          while IFS= read -r -d '' file; do
            target="$RUNNER_TEMP/assemble/$(basename "$file")"
            if [ -f "$target" ]; then
              cmp -s "$file" "$target" || { echo '同名软件包或签名字节冲突，拒绝覆盖历史版本' >&2; exit 1; }
            else cp "$file" "$target"; fi
          done < <(find "$RUNNER_TEMP/old" "$RUNNER_TEMP/pkgs" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.pkg.tar.*' \) -print0)
          for package in "$RUNNER_TEMP"/assemble/*.pkg.tar.zst "$RUNNER_TEMP"/assemble/*.pkg.tar.xz "$RUNNER_TEMP"/assemble/*.pkg.tar.gz; do
            [ -f "$package" ] || continue
            if [ ! -f "$package.sig" ]; then
              printf '%s\n' "${GPG_PASSPHRASE:-}" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --local-user "$GPG_KEY" --detach-sign -o "$package.sig" "$package"
            fi
            gpg --batch --verify "$package.sig" "$package"
          done
          python .github/scripts/channels/linux_repo.py --version "${{ needs.prepare.outputs.version }}" \
            --packages "$RUNNER_TEMP/assemble" --repo "$RUNNER_TEMP/repo"
      - name: 签名仓库元数据并发布公钥
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          sign() {
            printf '%s\n' "${GPG_PASSPHRASE:-}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$GPG_KEY" "$@"
          }
          sign --clearsign -o "$RUNNER_TEMP/repo/apt/dists/stable/InRelease" "$RUNNER_TEMP/repo/apt/dists/stable/Release"
          sign --detach-sign --armor -o "$RUNNER_TEMP/repo/apt/dists/stable/Release.gpg" "$RUNNER_TEMP/repo/apt/dists/stable/Release"
          gpg --armor --export "$GPG_KEY" > "$RUNNER_TEMP/repo/apt/key.asc"
          for file in "$RUNNER_TEMP"/repo/rpm/*/repodata/repomd.xml; do
            sign --detach-sign --armor -o "$file.asc" "$file"
          done
          gpg --armor --export "$GPG_KEY" > "$RUNNER_TEMP/repo/rpm/RPM-GPG-KEY-kenvoy"
          cat > "$RUNNER_TEMP/repo/rpm/kenvoy.repo" <<EOF
          [kenvoy]
          name=Kenvoy
          baseurl=https://raw.githubusercontent.com/${OWNER}/kenvoy-packages/gh-pages/rpm/\$basearch
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://raw.githubusercontent.com/${OWNER}/kenvoy-packages/gh-pages/rpm/RPM-GPG-KEY-kenvoy
          EOF
          for db in "$RUNNER_TEMP"/repo/arch/*/*.db.tar.gz "$RUNNER_TEMP"/repo/arch/*/*.files.tar.gz; do
            [ -f "$db" ] || continue
            sign --detach-sign -o "$db.sig" "$db"
            # raw.githubusercontent 不跟随 Git 符号链接，发布真正的 db/files 别名文件。
            cp --remove-destination "$db" "${db%.tar.gz}"
            cp --remove-destination "$db.sig" "${db%.tar.gz}.sig"
          done
          cp "$RUNNER_TEMP/apk/kenvoy.rsa.pub" "$RUNNER_TEMP/repo/alpine/kenvoy.rsa.pub"
          for index in "$RUNNER_TEMP"/repo/alpine/v3.20/main/*/APKINDEX.tar.gz; do
            [ -f "$index" ] || continue
            directory=$(dirname "$index")
            docker run --rm -v "$directory:/repo" -v "$RUNNER_TEMP/apk:/key:ro" alpine:3.20 \
              sh -c 'apk add --no-cache abuild >/dev/null && cd /repo && abuild-sign -k /key/kenvoy.rsa APKINDEX.tar.gz'
          done
          rpm --dbpath "$RUNNER_TEMP/rpm-keyring" --initdb
          rpmkeys --dbpath "$RUNNER_TEMP/rpm-keyring" --import "$RUNNER_TEMP/repo/rpm/RPM-GPG-KEY-kenvoy"
          for package in "$RUNNER_TEMP"/repo/rpm/*/*.rpm; do
            result=$(LC_ALL=C rpmkeys --dbpath "$RUNNER_TEMP/rpm-keyring" --checksig "$package")
            [[ "$result" == *"digests signatures OK"* ]] || { echo 'RPM 包签名验证失败，停止发布' >&2; exit 1; }
          done
      - name: 快进更新包仓库，不强推或丢弃历史
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/old"
          rm -rf apt rpm alpine arch
          cp -R "$RUNNER_TEMP/repo/." .
          cat > index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Kenvoy packages</title>
          <h1>Kenvoy 软件包仓库</h1>
          <ul><li><a href="apt/">APT</a></li><li><a href="rpm/">RPM</a></li><li><a href="alpine/">Alpine</a></li><li><a href="arch/">Arch</a></li></ul>
          EOF
          git add -A
          if git diff --cached --quiet; then echo '包仓库已是最新'; exit 0; fi
          git -c user.name=kenvoy-release -c user.email=release@users.noreply.github.com commit -q -m "kenvoy ${{ needs.prepare.outputs.version }}"
          git push origin HEAD:gh-pages
