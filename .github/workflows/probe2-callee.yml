name: Probe2 Callee
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
jobs:
  noop:
    runs-on: ubuntu-24.04
    steps:
      - name: 测试 secret 可见性
        env:
          T: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo 'CARGO_TOKEN 可见'; else echo 'CARGO_TOKEN 不可见' >&2; exit 1; fi
