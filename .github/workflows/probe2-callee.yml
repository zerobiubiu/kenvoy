name: Probe2 Callee
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  DIST_VERSION: ${{ inputs.version }}
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        run: |
          echo 'matrix={"include":[{"runner":"ubuntu-24.04","target":"t1"},{"runner":"ubuntu-24.04","target":"t2"}]}' >> "$GITHUB_OUTPUT"
  distribution:
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - run: echo 'target job'
  release:
    needs: distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - run: echo release-ok
