name: main 当前版本发布实现

# 仅供 main 自动与手动正式发布入口调用；不接受任意版本或开发分支输入。
on:
  workflow_call:
    secrets:
      CARGO_TOKEN:
        description: 仅在当前版本有缺失源包时使用的 crates.io Token
        required: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: 核对 main 最新版本、远端标签与发布状态
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      active: ${{ steps.plan.outputs.active }}
      publish_engine: ${{ steps.plan.outputs.publish_engine }}
      publish_kenvoy: ${{ steps.plan.outputs.publish_kenvoy }}
      release_required: ${{ steps.plan.outputs.release_required }}
      build_required: ${{ steps.plan.outputs.build_required }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - id: plan
        run: python .github/scripts/release_plan.py --output "$RUNNER_TEMP/kenvoy-release-plan.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4.6.2
        if: steps.plan.outputs.active == 'true'
        with:
          name: release-plan
          path: ${{ runner.temp }}/kenvoy-release-plan.json
          if-no-files-found: error
          retention-days: 14

  publish_crates:
    needs: plan
    if: github.ref == 'refs/heads/main' && (needs.plan.outputs.publish_engine == 'true' || needs.plan.outputs.publish_kenvoy == 'true')
    name: 发布当前版本源包（KEngine → Kenvoy CLI）
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4.4.0
        if: needs.plan.outputs.publish_kenvoy == 'true'
        with:
          node-version: '24.22.0'
      - name: 准备固定 Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-plan
          path: ${{ runner.temp }}/kenvoy-plan
      - name: 从独占源码快照生成前端、验证并串行上传缺失源包
        run: python .github/scripts/publish_crates.py --plan "$RUNNER_TEMP/kenvoy-plan/kenvoy-release-plan.json"
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}

  binaries:
    needs: [plan, publish_crates]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          needs.plan.result == 'success' && needs.plan.outputs.build_required == 'true' &&
          (needs.publish_crates.result == 'success' || needs.publish_crates.result == 'skipped') }}
    name: 打包 ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.plan.outputs.version }}
          source-mode: registry
          archive-name: ${{ matrix.archive }}

  release:
    needs: [plan, publish_crates, binaries]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          needs.plan.result == 'success' && needs.plan.outputs.release_required == 'true' &&
          (needs.publish_crates.result == 'success' || needs.publish_crates.result == 'skipped') &&
          (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
    name: 补齐并发布 Kenvoy ${{ needs.plan.outputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-plan
          path: ${{ runner.temp }}/kenvoy-plan
      - uses: actions/download-artifact@v4.3.0
        if: needs.plan.outputs.build_required == 'true'
        with:
          pattern: kenvoy-${{ needs.plan.outputs.version }}-*
          path: ${{ runner.temp }}/kenvoy-binaries
          merge-multiple: true
      - name: 核验资产并发布（不覆盖既有 ZIP、侧车或 tag）
        run: >-
          python .github/scripts/publish_release.py
          --plan "$RUNNER_TEMP/kenvoy-plan/kenvoy-release-plan.json"
          --artifacts "$RUNNER_TEMP/kenvoy-binaries"
        env:
          GH_TOKEN: ${{ github.token }}
