name: main 最新版本手动发布兜底

# 文件名保留，职责不再是从开发分支发布 PATCH；与自动发布复用同一实现。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 输入 yes，补齐 main 当前版本的缺失发布步骤
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kenvoy-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'yes'
    permissions:
      contents: write
    uses: ./.github/workflows/release-one-version.yml
    secrets:
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
