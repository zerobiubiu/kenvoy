name: Probe2
on:
  push:
    branches: [ci-probe2]
jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.d.outputs.head }}
    steps:
      - id: d
        run: echo "head=9.9.9" >> "$GITHUB_OUTPUT"
  call:
    needs: detect
    uses: ./.github/workflows/probe2-callee.yml
    with:
      version: ${{ needs.detect.outputs.head }}
