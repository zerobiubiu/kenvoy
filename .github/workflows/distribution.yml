name: Kenvoy 分支模型全自动发布

# 分支模型：
# - dev：常驻开发分支，推送不触发发布。
# - dev.MAJOR.MINOR.PATCH：每个新版本从 dev 分出，成熟后由维护者决定是否合并。
# - main：只承载最新 MAJOR.MINOR.0（PATCH 不进 main）；main 更新才触发本工作流。
# 发布规则：
# - 读取 main 上 crates/kenvoy/Cargo.toml 的版本号，必须为 x.y.0，否则本次不发布并告警。
# - 对该版本检查 crates.io 与 GitHub Release：均存在则空跑跳过。
# - 全历史扫描：所有 x.y.0 历史版本中缺 crate 或 Release 的，按语义化顺序逐个补齐。
# - 自动 cargo publish（kengine → kenvoy 串行），失败即停，不发布坏包。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 精确发布版本（如 0.2.0）；留空则按 main 与历史扫描检测
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-main
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  PYTHONUTF8: '1'
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'

jobs:
  detect:
    # 派生本次要发布的版本清单（语义化升序，仅 x.y.0）。空清单 = 无需更新，空跑结束。
    name: 检测待发布版本
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
      head: ${{ steps.detect.outputs.head }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'kenvoy-distribution (https://github.com/zerobiubiu/kenvoy)',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          def crate_exists(crate, version):
              try:
                  fetch(f'https://crates.io/api/v1/crates/{crate}/{version}')
                  return True
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return False
                  raise

          def release_exists(tag):
              try:
                  fetch(f"https://api.github.com/repos/zerobiubiu/kenvoy/releases/tags/{tag}")
                  return True
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return False
                  raise

          def declared_kenvoy_version(treeish):
              manifest = subprocess.run(
                  ['git', 'show', f'{treeish}:crates/kenvoy/Cargo.toml'],
                  capture_output=True, text=True, check=True,
              ).stdout
              return next(
                  (line.split('"')[1] for line in manifest.splitlines()
                   if line.strip().startswith('version = "')),
                  None,
              )

          manual = os.environ.get('DISPATCH_VERSION', '').strip()
          candidates = set()

          if manual:
              # 手动指定版本：仍走 x.y.0 门禁与存在性检测
              parts = manual.split('.')
              if len(parts) != 3 or parts[2] != '0':
                  raise SystemExit(f'发布规则仅允许 MAJOR.MINOR.0，实际 {manual}')
              candidates.add(manual)
          else:
              # 1) main 当前版本：必须为 x.y.0，否则告警且不作为候选
              head_version = declared_kenvoy_version('origin/main')
              parts = head_version.split('.') if head_version else []
              if len(parts) == 3 and parts[2] == '0':
                  candidates.add(head_version)
              else:
                  print(f'::warning::main 上 kenvoy 版本为 {head_version}，不是 x.y.0，本次不作为发布候选')

              # 2) 全历史扫描：所有 v*.*.* tag 中 x.y.0 且缺失 crate/Release 的补齐
              result = subprocess.run(
                  ['git', 'tag', '-l', 'v*.*.*', '--sort', 'v:refname'],
                  capture_output=True, text=True, check=True,
              )
              for tag in (line.strip() for line in result.stdout.splitlines() if line.strip()):
                  version = tag[1:]
                  if version.split('.')[-1] != '0':
                      continue  # PATCH 不发布
                  tag_version = declared_kenvoy_version(tag)
                  if tag_version != version:
                      print(f'::warning::tag {tag} 内 kenvoy 版本为 {tag_version}，与 tag 名不一致，跳过')
                      continue
                  if not crate_exists('kenvoy', version) or not release_exists(tag):
                      candidates.add(version)

          versions = sorted(candidates, key=lambda v: tuple(int(p) for p in v.split('.')))
          print(f'待发布版本（升序）：{versions or "无"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'versions={json.dumps(versions)}\n')
              output.write(f"head={versions[0] if versions else ''}\n")

  publish_and_release:
    # head 版本完整发布：crates.io（kengine→kenvoy 串行）+ 六目标构建 + GitHub Release。
    # 剩余版本由 detect 的全历史扫描在下次 main 更新时继续补齐（避免单次运行无限链深）。
    if: needs.detect.outputs.head != ''
    needs: detect
    name: 发布 ${{ needs.detect.outputs.head }}
    uses: ./.github/workflows/release-one-version.yml
    with:
      version: ${{ needs.detect.outputs.head }}
    secrets:
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}

  noop:
    # 空跑：没有待发布版本时给出明确结果，运行成功结束。
    if: needs.detect.outputs.head == ''
    needs: detect
    name: 无待发布版本
    runs-on: ubuntu-24.04
    steps:
      - name: 说明
        run: echo 'main 版本与全部历史 x.y.0 的 crate/Release 均已存在，本次无需发布。'
