name: 手动单平台打包

# 任意分支均可手动选择一个系统与架构；只上传 artifact，不发布 crate 或 Release。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 目标平台
        required: true
        type: choice
        options: [windows, linux, macos]
      arch:
        description: 目标架构
        required: true
        type: choice
        options: [x86_64, ARM64]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  select:
    name: 从统一清单选择唯一打包目标
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - name: 取得工程编排代码
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: 准备固定 Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.10'

      - name: 读取当前版本与单个目标
        id: select
        shell: bash
        env:
          DIST_PLATFORM: ${{ inputs.platform }}
          DIST_ARCH: ${{ inputs.arch }}
        run: |
          python .github/scripts/package_source.py select \
            --platform "$DIST_PLATFORM" --arch "$DIST_ARCH"

  build:
    name: ${{ matrix.platform }} · ${{ matrix.arch }}
    needs: select
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: 取得工程编排与产品源码
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: 打包唯一选定目标（不发布）
        uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.select.outputs.version }}
          source-mode: checkout
