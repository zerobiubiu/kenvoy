[package]
name = "kenvoy"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "将 TypeScript/JSX 声明解释为页面、受控 API 和 SQLite 持久化应用的原生 CLI"
readme = "README.md"
keywords = ["cli", "typescript", "web", "sqlite"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "/src/**",
    "/tests/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/frontend/index.html",
    "/frontend/package.json",
    "/frontend/package-lock.json",
    "/frontend/tsconfig.json",
    "/frontend/vite.config.mjs",
    "/frontend/src/**",
    "/frontend/scripts/client-builder.mjs",
    "/frontend/scripts/client-dev.mjs",
    "/frontend/dist/index.html",
    "/frontend/dist/assets/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ os-name }-{ target-arch }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-windows-ARM64.zip"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-linux-ARM64.zip"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-macos-ARM64.zip"

[dependencies]
kengine = { path = "../kengine", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
clap.workspace = true
toml.workspace = true
semver.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tokio.workspace = true
sha2.workspace = true
argon2.workspace = true
getrandom.workspace = true
hmac.workspace = true
rpassword.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
swc_common.workspace = true
swc_ecma_ast.workspace = true
swc_ecma_parser.workspace = true
swc_ecma_visit.workspace = true
swc_ecma_codegen.workspace = true
swc_ecma_transforms_base.workspace = true
swc_ecma_transforms_typescript.workspace = true
rquickjs.workspace = true
notify.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[build-dependencies]
sha2.workspace = true
toml.workspace = true
